    <!-- Header -->

        <h1>Events gallery</h1>

    <!-- Gallery Grid -->
    <main class="max-w-7xl mx-auto px-4 pb-20">
        <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            <!-- Items injected by JavaScript -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox fixed inset-0 z-50 flex-col items-center justify-center p-4" onclick="closeLightbox()">
        
        <!-- Navigation: Prev -->
        <button class="nav-btn absolute left-4 md:left-8 top-1/2 -translate-y-1/2 p-3 rounded-full text-white z-10" onclick="prevImage(event)" aria-label="Previous image">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>

        <!-- Navigation: Next -->
        <button class="nav-btn absolute right-4 md:right-8 top-1/2 -translate-y-1/2 p-3 rounded-full text-white z-10" onclick="nextImage(event)" aria-label="Next image">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>

        <!-- Close Button -->
        <button class="absolute top-6 right-6 text-white/70 hover:text-white transition-colors focus:outline-none z-20" onclick="closeLightbox()" aria-label="Close lightbox">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        
        <!-- Content Area -->
        <div class="max-w-5xl w-full h-[80vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="Full view" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl">
            
            <!-- Image Info -->
            <div class="mt-6 text-center text-white px-4">
                <h2 id="lightbox-title" class="text-xl font-semibold leading-tight"></h2>
                <p id="lightbox-meta" class="text-sm text-gray-400 mt-1"></p>
                <p id="lightbox-counter" class="text-xs text-gray-500 mt-4 tracking-widest uppercase"></p>
            </div>
        </div>
    </div>


<!--Footer div start here-->

<!--Footer div end here-->

            "https://unggim-psn.wgicouncil.org/images/events/UN-GGIM PSN chaired the meeting of UN-GGIM Thematic Network at the side event of UN-GGIM 15th Session at UN Head Quarters in New York3.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/UN-GGIM PSN chaired the meeting of UN-GGIM Thematic Network at the side event of UN-GGIM 15th Session at UN Head Quarters in New York2.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/UN-GGIM PSN chaired the meeting of UN-GGIM Thematic Network at the side event of UN-GGIM 15th Session at UN Head Quarters in New York.jpg",

            "https://unggim-psn.wgicouncil.org/images/events/UN-GGIM PSN at the UN-GGIM Arab States 11th Plenary Pre-Workshops at Doha, Qatar3.jpg",

            "https://unggim-psn.wgicouncil.org/images/events/UN-GGIM PSN at the 12th Plenary meeting of the UN-GGIM Europe in Brussels3.jpg",

            "https://unggim-psn.wgicouncil.org/images/events/UN-GGIM PSN at the 12th Plenary meeting of the UN-GGIM Europe in Brussels.jpg",

            "https://unggim-psn.wgicouncil.org/images/events/Leadership of the UN-GGIM Thematic Network at the UN-GGIM 14th session at UN HQ, New York.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/Chair UN-GGIM PSN introducing Agenda item 5 - Contribution of thematic networks to the global geospatial information on behalf of the UN-GGIM3.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/Chair UN-GGIM PSN introducing Agenda item 5 - Contribution of thematic networks to the global geospatial information on behalf of the UN-GGIM2.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/Chair UN-GGIM PSN introducing Agenda item 5 - Contribution of thematic networks to the global geospatial information on behalf of the UN-GGIM.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/Asia Pacific Regional Consultations.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/Arab States Regional Consultations.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/Americas Regional Consultations.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/Africa Regional Consultations.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/13th UNGGIM Committee of Experts Meeting at UN Headquarters in New York.jpg",
            "https://unggim-psn.wgicouncil.org/images/events/10th Session of UN-GGIM Americas in Santiago de Chile from October 17-20, 2023.jpg"
        ];

        const images = imageList.map(url => {
            const fileName = url.substring(url.lastIndexOf('/') + 1);
            const title = decodeURIComponent(fileName).replace(/\.(jpg|jpeg|png|jfif2|jfif|webp)$/i, '');
            return {
                src: url,
                title: title,
                meta: 'Events'
            };
        });

        let currentIndex = 0;
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxMeta = document.getElementById('lightbox-meta');
        const lightboxCounter = document.getElementById('lightbox-counter');

        function renderGallery() {
            gallery.innerHTML = images.map((img, index) => `
                <div class="gallery-item relative overflow-hidden rounded-xl bg-gray-200 aspect-square cursor-pointer group" onclick="openLightbox(${index})">
                    <img src="${img.src}" alt="${img.title}" class="w-full h-full object-cover object-top" loading="lazy">
                    <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-3 translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300 bg-gradient-to-t from-black/80 to-transparent">
                        <p class="text-white font-medium text-[11px] leading-tight line-clamp-2">${img.title}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateLightbox() {
            const data = images[currentIndex];
            lightboxImg.style.opacity = '0';
            
            setTimeout(() => {
                lightboxImg.src = data.src;
                lightboxTitle.innerText = data.title;
                lightboxMeta.innerText = data.meta;
                lightboxCounter.innerText = `${currentIndex + 1} / ${images.length}`;
                lightboxImg.style.opacity = '1';
            }, 50);
        }

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; 
        }

        function nextImage(e) {
            if (e) e.stopPropagation();
            currentIndex = (currentIndex + 1) % images.length;
            updateLightbox();
        }

        function prevImage(e) {
            if (e) e.stopPropagation();
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateLightbox();
        }

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

        window.onload = () => {
            renderGallery();
            lightboxImg.style.transition = 'opacity 0.3s ease';
        };
    </script>

<script type="text/javascript">
    $(function() {
    $('.header .navigation #menu li a[href*=#]:not([href=#])').click(function() {
      if (location.pathname.replace(/^\//,'') == this.pathname.replace(/^\//,'') && location.hostname == this.hostname) {
        var target = $(this.hash);
        target = target.length ? target : $('[name=' + this.hash.slice(1) +']');
        if (target.length) {
          $('html,body').animate({
            scrollTop: target.offset().top -10
          }, 500);
          return false;
        }
      }
    });
    });
</script>
